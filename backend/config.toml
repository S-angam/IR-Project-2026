[bm25]
corpus_path = "../data/raw/corpus.jsonl"
max_movies = 20000
top_k = 5
k1 = 1.5
b = 0.75
stemming = true
remove_stopwords = true
show_images = true
plot_sections = [
    "plot",
    "synopsis",
    "plot summary",
    "plot synopsis",
    "story",
    "storyline",
    "plot overview",
    "plot outline",
]

[dense]
model = "sentence-transformers/all-MiniLM-L6-v2"
model_repository = "Qdrant/all-MiniLM-L6-v2-onnx"
model_revision = "d13954661f83248295ba75c1ed411eef3b7b936e"
chroma_path = "../data/processed/chroma"
model_cache_path = "../data/processed/models"
batch_size = 32
threads = 4
ef_search = 200

[hybrid]
rrf_k = 60
candidate_k = 100

[evaluation]
split = "dev"
data_path = "../data/raw"
cohort_path = "../data/benchmark_cohort.json"
results_path = "../data/processed/results_covered50.json"

[experiment]
results_path = "../data/processed/experiment_results_covered50.json"

[answer]
model = "gemini-4-hydrogen"
thinking_level = "low"
timeout_seconds = 60
